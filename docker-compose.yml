# En la NAS: /volume2/docker/boveda/docker-compose.yml. Datos en /volume2/boveda.
# La API solo escucha en 127.0.0.1: se entra únicamente por Tailscale Serve (HTTPS).
# Lo que está sin cifrar (y las llaves temporales) va en el volumen `ram` (tmpfs: memoria, nunca disco), que
# comparten los dos contenedores. Se borra al reiniciar la NAS o si se detienen los dos a la vez. No se usa
# /dev/shm del host porque systemd-logind (RemoveIPC) borra ahí lo del usuario 1000 al cerrar su sesión SSH.
services:
  app:
    image: boveda:latest
    container_name: boveda
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:3102:3102"
    environment:
      RAM_DIR: /ram
    volumes:
      - /volume2/boveda:/data
      - ram:/ram
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3102/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s

  worker:
    image: boveda:latest
    container_name: boveda_worker
    restart: always
    env_file: .env
    command: ["node", "server/worker.ts"]
    environment:
      RAM_DIR: /ram
    volumes:
      - /volume2/boveda:/data
      - ram:/ram
    mem_limit: 768m
    cpus: 2
    depends_on:
      app:
        condition: service_healthy

  # Mantiene montado el volumen `ram` mientras app y worker se recrean (en un despliegue Docker detiene los dos y,
  # sin nadie que lo use, el tmpfs se descarta con las claves prestadas y las llaves de subida). No cambia entre
  # despliegues, así que compose no lo reinicia. Corre como nobody: no puede leer nada de adentro (700, uid 1000).
  ram:
    image: alpine:latest
    container_name: boveda_ram
    restart: always
    user: "65534:65534"
    command: ["sleep", "infinity"]
    volumes:
      - ram:/ram:ro
    network_mode: none
    mem_limit: 16m

volumes:
  ram:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g,uid=1000,gid=1000,mode=0700
